[package]
name = "agent-ai"
description = "Agent AI (وكيل): chat with Claude, Gemini, OpenRouter and free models, with agents that use your apps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-ai"
path = "src/main.rs"

[dependencies]
agentai-core.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit", "clipboard", "wayland", "x11", "links"] }
rfd.workspace = true
sys-locale = "0.3"


# The app icon inside Agent AI.exe (shown in Explorer and the taskbar).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
